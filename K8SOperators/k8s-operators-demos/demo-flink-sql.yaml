---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: demo-flink-sql
spec:
  image: container.repository.cloudera.com/cloudera/flink:1.19.2-csaop1.2.0-b27
  flinkVersion: v1_19
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
  serviceAccount: flink
  mode: native
  jobManager:
    resource:
      memory: 1024Mi
      cpu: 0.4
  taskManager:
    resource:
      memory: 1024Mi
      cpu: 0.4
  job:
    entryClass: com.cloudera.streaming.examples.flink.SqlTransformJob
    args:
      - --sourceTableDdl
      - CREATE TABLE source_table (
          `id` BIGINT,
          `now` STRING,
          `host` STRING,
          `ts` TIMESTAMP(3) METADATA FROM 'timestamp'
        ) WITH (
          'connector' = 'kafka',
          'topic' = 'demo-topic',
          'properties.bootstrap.servers' = 'demo-kafka-kafka-bootstrap.csm-op.svc.cluster.local:9092',
          'properties.group.id' = 'testGroup',
          'scan.startup.mode' = 'latest-offset',
          'format' = 'json'
        )
      - --sinkTableDdl
      - CREATE TABLE sink_table (
          `id` BIGINT,
          `now` STRING,
          `host` STRING,
          `short_name` STRING,
          `processed_at` STRING,
          `latency_ms` BIGINT,
          `ts` TIMESTAMP(3) METADATA FROM 'timestamp'
        ) WITH (
          'connector' = 'kafka',
          'topic' = 'demo-sql',
          'properties.bootstrap.servers' = 'demo-kafka-kafka-bootstrap.csm-op.svc.cluster.local:9092',
          'properties.group.id' = 'testGroup',
          'scan.startup.mode' = 'latest-offset',
          'format' = 'json'
        )
      - --insertStatement
      - INSERT INTO sink_table (id, now, host, short_name, processed_at, latency_ms)
        SELECT
          id, now, host,
          upper(regexp_replace(host, '\..*', '')) as short_name,
          cast(proc_ts as string) as processed_at,
          cast((1000000 * (extract(epoch from proc_ts) - extract(epoch from now_ts))
               + extract(microsecond from proc_ts)
               - extract(microsecond from now_ts)) / 1000 as bigint) as latency_ms
        FROM (
          SELECT
            id, now, host,
            cast(regexp_replace(regexp_replace(now, 'T', ' '), '/', '-') as timestamp(3)) as now_ts,
            now() as proc_ts
          FROM source_table
          WHERE host like 'host-1%'
        ) _source
    jarURI: local:///jarfiles/job.jar
    parallelism: 4
    state: running
    upgradeMode: stateless

  podTemplate:
    spec:
      imagePullSecrets:
        - name: gcf-creds
      initContainers:
        - name: init-jar-downloader
          image: appropriate/curl
          args:
            - "-o"
            - "/jarfiles/job.jar"
            - "http://demo-nginx-service.default.svc.cluster.local:31080/files/flink-kubernetes-tutorial-1.18.0-csaop1.0.0-SNAPSHOT.jar"
          volumeMounts:
            - name: jar-files
              mountPath: /jarfiles
      containers:
        - name: flink-main-container
          volumeMounts:
            - name: jar-files
              mountPath: /jarfiles
      volumes:
        - name: jar-files
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi

