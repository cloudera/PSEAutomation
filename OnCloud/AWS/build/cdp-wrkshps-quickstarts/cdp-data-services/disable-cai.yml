---
- name: Disable CAI data service
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    ds_disable_wait_retries: 120
    ds_disable_wait_delay: 30
  tasks:
    - name: Check and print variable status
      debug:
        msg: "cdp_env_name: {{ cdp_env_name }}, workshop_name: {{ workshop_name }}, workspace_name: {{ workshop_name }}-cai-ws"

    - name: List CAI Workspaces for existence check
      ansible.builtin.shell: >
        cdp ml list-workspaces | jq -r '.workspaces[].instanceName'
      register: ml_list_workspaces
      failed_when: false
      changed_when: false

    - name: Set workspace exists flag
      set_fact:
        workspace_exists: "{{ ml_list_workspaces.rc == 0 and (workshop_name + '-cai-ws' in ml_list_workspaces.stdout_lines ) }}"

    - name: Handle non-existing or deleted workspace
      debug:
        msg: "Workspace {{ workshop_name }}-cai-ws does not exist or is already deleted in environment {{ cdp_env_name }}."
      when: not workspace_exists or 'resourceCrn should not be empty or nil' in (ml_list_workspaces.stderr | default(''))

    - name: End play when workspace does not exist
      ansible.builtin.meta: end_play
      when: not workspace_exists

    - name: Delete CAI Workspace if exists
      ansible.builtin.command: >
        cdp ml delete-workspace \
        --environment-name "{{ cdp_env_name }}" \
        --workspace-name "{{ workshop_name }}-cai-ws" \
        --no-force
      register: ml_delete_workspace
      when: workspace_exists

    - name: Pause for 30 seconds after triggering deprovisioning workspace
      pause:
        seconds: 30
      when: workspace_exists

    - name: Poll until CAI workspace absent from list-workspaces
      ansible.builtin.shell: |
        cdp ml list-workspaces 2>/dev/null | jq -r --arg ws "{{ workshop_name }}-cai-ws" --arg env "{{ cdp_env_name }}" '
          [.workspaces[]? | select(.instanceName == $ws and .environmentName == $env)] | length'
      register: cai_ws_list_count
      changed_when: false
      until: >
        (cai_ws_list_count.stdout | default('1') | trim | int) == 0 or
        'resourceCrn should not be empty or nil' in (cai_ws_list_count.stderr | default(''))
      retries: "{{ ds_disable_wait_retries }}"
      delay: "{{ ds_disable_wait_delay }}"
      when: workspace_exists

    - name: Capture CAI workspace status while teardown runs
      ansible.builtin.shell: >
        cdp ml list-workspaces 2>/dev/null | jq -r '.workspaces[] |
        select(.instanceName == "{{ workshop_name }}-cai-ws" and .environmentName == "{{ cdp_env_name }}") |
        .instanceStatus'
      register: ml_ws_status
      changed_when: false
      failed_when: false
      when: workspace_exists

    - name: Fail when CAI workspace deletion failed
      ansible.builtin.fail:
        msg: "CAI workspace {{ workshop_name }}-cai-ws deletion failed (status: {{ ml_ws_status.stdout | default('unknown') }})."
      when: >
        workspace_exists and
        ml_ws_status.stdout is defined and
        ml_ws_status.stdout in ["installation:failed", "modify:failed", "deprovision:failed"]

    - name: Fail when CAI workspace still listed after teardown wait
      ansible.builtin.fail:
        msg: >-
          CAI workspace {{ workshop_name }}-cai-ws still appears in list-workspaces for {{ cdp_env_name }}
          after {{ ds_disable_wait_retries * ds_disable_wait_delay }}s.
      when: >
        workspace_exists and
        (cai_ws_list_count.stdout | default('1') | trim | int) > 0 and
        'resourceCrn should not be empty or nil' not in (cai_ws_list_count.stderr | default(''))

    - name: Print success message on workspace deletion
      ansible.builtin.debug:
        msg: "Successfully deleted workspace {{ workshop_name }}-cai-ws in environment {{ cdp_env_name }}."
      when: >
        not workspace_exists or
        (cai_ws_list_count.stdout | default('1') | trim | int) == 0 or
        'resourceCrn should not be empty or nil' in (cai_ws_list_count.stderr | default(''))
