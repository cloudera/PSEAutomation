---
- name: Log CDF enable CLI attempt
  ansible.builtin.debug:
    msg: >-
      CDF enable CLI attempt {{ cdf_enable_attempt }}/{{ cdf_enable_api_retries }}
      for {{ cdp_env_name }} (cdp df enable-service)

- name: Build CDF enable CLI argument list
  ansible.builtin.set_fact:
    cdf_enable_cli_argv: >-
      {{
        [
          'cdp', 'df', 'enable-service',
          '--environment-crn', cdp_env_crn,
          '--min-k8s-node-count', (minimum_nodes | int | string),
          '--max-k8s-node-count', (maximum_nodes | int | string)
        ]
        + (
          ['--use-public-load-balancer']
          if (use_public_load_balancer | bool)
          else ['--no-use-public-load-balancer']
        )
        + (
          ['--instance-type', (instance_type | trim)]
          if (
            instance_type is defined
            and (instance_type | default('') | trim | length) > 0
          )
          else []
        )
        + (
          ['--cluster-subnets'] + (cdf_cluster_subnets | list)
          if (
            cdf_cluster_subnets is defined
            and (cdf_cluster_subnets | length) > 0
          )
          else []
        )
        + (
          ['--load-balancer-subnets'] + (cdf_lb_subnets | list)
          if (
            not (use_public_load_balancer | bool)
            and cdf_lb_subnets is defined
            and (cdf_lb_subnets | length) > 0
          )
          else []
        )
      }}

- name: Submit CDF enable request via CDP CLI
  ansible.builtin.command:
    argv: "{{ cdf_enable_cli_argv }}"
  register: cdf_enable_cmd
  changed_when: cdf_enable_cmd.rc == 0
  failed_when: false

- name: Build CDF enable attempt result facts
  ansible.builtin.set_fact:
    cdf_enable_combined_msg: >-
      {{
        (
          (cdf_enable_cmd.stderr | default('') | string)
          ~ ' '
          ~ (cdf_enable_cmd.stdout | default('') | string)
        ) | trim
      }}
    cdf_enable_stuck_precondition: >-
      {{
        (
          (
            (cdf_enable_cmd.stderr | default('') | string)
            ~ ' '
            ~ (cdf_enable_cmd.stdout | default('') | string)
          ) | trim
        ) is search('(?i)(FAILED_PRECONDITION|\\[412\\]|Status Code: 412|CANCEL_ENABLE|cannot be enabled at the moment|valid actions.*CANCEL_ENABLE)')
      }}
    cdf_enable_conflict_ok: >-
      {{
        (
          (
            (cdf_enable_cmd.stderr | default('') | string)
            ~ ' '
            ~ (cdf_enable_cmd.stdout | default('') | string)
          ) | trim
        ) is search('(?i)(already exists|CONFLICT|already enabled|enable.*in progress|ENABLING)')
      }}
    cdf_enable_effective_rc: >-
      {{
        0
        if (
          (cdf_enable_cmd.rc | default(1) | int) == 0
          or (
            (
              (
                (cdf_enable_cmd.stderr | default('') | string)
                ~ ' '
                ~ (cdf_enable_cmd.stdout | default('') | string)
              ) | trim
            ) is search('(?i)(already exists|CONFLICT|already enabled|enable.*in progress|ENABLING|FAILED_PRECONDITION|\\[412\\]|Status Code: 412|CANCEL_ENABLE|cannot be enabled at the moment|valid actions.*CANCEL_ENABLE)')
          )
        )
        else (cdf_enable_cmd.rc | default(1) | int)
      }}

- name: Set CDF enable poll-only flag for stuck or in-flight enable
  ansible.builtin.set_fact:
    cdf_enable_poll_only: >-
      {{
        (
          (cdf_enable_stuck_precondition | default(false) | bool) or
          (cdf_enable_conflict_ok | default(false) | bool)
        ) | bool
      }}

- name: Set CDF enable attempt result payload
  ansible.builtin.set_fact:
    cdf_enable_attempt_result:
      failed: "{{ (cdf_enable_effective_rc | int) != 0 }}"
      changed: "{{ (cdf_enable_effective_rc | int) == 0 }}"
      rc: "{{ cdf_enable_effective_rc | int }}"
      msg: >-
        {{
          (
            'CDF enable-service: stuck or in-flight enable (412/CANCEL_ENABLE or ENABLING) — continuing with health poll'
            if (cdf_enable_stuck_precondition | default(false) | bool)
            else (
              'CDF enable-service: service already present or enabling — continuing with health poll'
              if (cdf_enable_conflict_ok | default(false) | bool)
              else (
                (
                  (cdf_enable_cmd.stderr | default('') | string)
                  ~ ' '
                  ~ (cdf_enable_cmd.stdout | default('') | string)
                ) | trim
              )
            )
          )
        }}
      stderr: "{{ cdf_enable_cmd.stderr | default('') }}"
      stdout: "{{ cdf_enable_cmd.stdout | default('') }}"
    cdf_enable_msg: >-
      {{
        (
          'CDF enable-service: stuck or in-flight enable (412/CANCEL_ENABLE or ENABLING) — continuing with health poll'
          if (cdf_enable_stuck_precondition | default(false) | bool)
          else (
            'CDF enable-service: service already present or enabling — continuing with health poll'
            if (cdf_enable_conflict_ok | default(false) | bool)
            else (
              (
                (cdf_enable_cmd.stderr | default('') | string)
                ~ ' '
                ~ (cdf_enable_cmd.stdout | default('') | string)
              ) | trim
            )
          )
        )
      }}
    cdf_enable_has_api_error: >-
      {{
        (
          not (cdf_enable_poll_only | default(false) | bool)
        ) and (
          (
            (
              (cdf_enable_cmd.stderr | default('') | string)
              ~ ' '
              ~ (cdf_enable_cmd.stdout | default('') | string)
            ) | trim
          ) is search('(?i)(INTERNAL|authorizing|\\[500\\]|error occurred while|timed out|access denied|not authorized|permission)')
        )
      }}
    cdf_enable_is_authorizing_500: >-
      {{
        (
          not (cdf_enable_poll_only | default(false) | bool)
        ) and (
          (
            (
              (cdf_enable_cmd.stderr | default('') | string)
              ~ ' '
              ~ (cdf_enable_cmd.stdout | default('') | string)
            ) | trim
          ) is search('(?i)(authorizing|\\[500\\]|error occurred while authorizing)')
        )
      }}
    cdf_enable_should_retry: >-
      {{
        (
          (cdf_enable_effective_rc | int) != 0
        ) and (
          not (cdf_enable_stuck_precondition | default(false) | bool)
        ) and (
          not (
            (
              (
                (cdf_enable_cmd.stderr | default('') | string)
                ~ ' '
                ~ (cdf_enable_cmd.stdout | default('') | string)
              ) | trim
            ) is search('(?i)(FAILED_PRECONDITION|\\[412\\]|Status Code: 412|CANCEL_ENABLE|cannot be enabled at the moment)')
          )
        ) and (
          (
            (
              (cdf_enable_cmd.stderr | default('') | string)
              ~ ' '
              ~ (cdf_enable_cmd.stdout | default('') | string)
            ) | trim
          ) is search('(?i)(INTERNAL|authorizing|\\[500\\]|error occurred while|try again later|timed out|throttl)')
        ) and (
          (cdf_enable_attempt | int) < (cdf_enable_api_retries | int)
        )
      }}

- name: Record CDF enable CLI result for playbook
  ansible.builtin.set_fact:
    cdf_enable_result: "{{ cdf_enable_attempt_result }}"
    cdf_enable_retry_done: "{{ not (cdf_enable_should_retry | default(false) | bool) }}"

- name: Log CDF enable attempt outcome
  ansible.builtin.debug:
    msg: >-
      CDF enable attempt {{ cdf_enable_attempt }}/{{ cdf_enable_api_retries }} outcome:
      rc={{ cdf_enable_effective_rc | default('n/a') }},
      poll_only={{ cdf_enable_poll_only | default(false) }},
      stuck_precondition={{ cdf_enable_stuck_precondition | default(false) }},
      api_error={{ cdf_enable_has_api_error | default(false) }},
      will_retry={{ cdf_enable_should_retry | default(false) }},
      msg={{ cdf_enable_msg | truncate(400, True, '...') }}

- name: Pause before next CDF enable retry
  ansible.builtin.pause:
    seconds: "{{ cdf_enable_retry_delay | int }}"
  when: cdf_enable_should_retry | default(false) | bool
