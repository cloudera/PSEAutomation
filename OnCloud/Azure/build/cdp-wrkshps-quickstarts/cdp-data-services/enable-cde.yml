---
- name: Enable CDE data service
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    instance_type: "Standard_D8s_v5"
    cde_instance_type_fallbacks:
      - "Standard_D8s_v5"
      - "Standard_D8as_v5"
      - "Standard_D8ds_v5"
      - "Standard_D16s_v5"
    initial_instances: 10
    minimum_instances: 10
    maximum_instances: 40
    spark_version: "SPARK3"
    vc_tier: "CORE"  # Default value for vc-tier, can be "ALLP" or "CORE"
    cde_async_timeout: 7200
    cde_async_retries: 120
    cde_async_delay: 30

  tasks:
    - name: Check and print variable status
      debug:
        msg:
          - "instance_type: {{ instance_type }}"
          - "initial_instances: {{ initial_instances }}"
          - "minimum_instances: {{ minimum_instances }}"
          - "maximum_instances: {{ maximum_instances }}"
          - "spark_version: {{ spark_version }}"
          - "vc_tier: {{ vc_tier }}"
          - "workshop_name: {{ workshop_name }}"
          - "cdp_env_name: {{ cdp_env_name }}"
          - "number_vc_to_create: {{ number_vc_to_create | default(1) }}"
          - "cde_cluster_managed_identity_id: {{ cde_cluster_managed_identity_id }}"
          - "cde_vc_managed_identity_id: {{ cde_vc_managed_identity_id }}"

    - name: Normalize Spark version for CDE CLI
      ansible.builtin.set_fact:
        cde_spark_version_cli: >-
          {{
            'SPARK3'
            if (spark_version | default('SPARK3') | upper) in ['AUTO', '']
            else (spark_version | upper)
          }}

    - name: Print normalized Spark version
      ansible.builtin.debug:
        msg: >-
          Using Spark version {{ cde_spark_version_cli }}
          (requested: {{ spark_version | default('SPARK3') }}).
      when: (spark_version | default('SPARK3') | upper) != cde_spark_version_cli

    - name: Check if CDE service exists and is running
      cloudera.cloud.de_info:
        name: "{{ workshop_name }}-cde"
      register: deservicestatus
      failed_when: false

    - name: Debug CDE service info
      debug:
        msg: "{{ deservicestatus }}"

    - name: Sanitize instance type value
      ansible.builtin.set_fact:
        instance_type: >-
          {{
            (instance_type | regex_search('Standard_[A-Za-z0-9_]+'))
            | default(instance_type, true)
          }}

    - name: Initialize CDE service state flags
      ansible.builtin.set_fact:
        cde_service_present: false
        cde_service_ready: false

    - name: Determine CDE service state
      ansible.builtin.set_fact:
        cde_service_present: "{{ (deservicestatus.services | default([], true) | length) > 0 }}"
        cde_service_ready: >-
          {{
            (deservicestatus.services | default([], true)
            | selectattr('status', 'equalto', 'ClusterCreationCompleted')
            | list | length) > 0
          }}
      when: deservicestatus is succeeded

    - name: Skip activation when CDE service already exists
      ansible.builtin.debug:
        msg: >-
          CDE service {{ workshop_name }}-cde already exists
          (status: {{ deservicestatus.services[0].status | default('unknown') }}) —
          skipping enable; waiting for completion if needed.
      when: cde_service_present

    - name: Build CDE instance type attempt list
      ansible.builtin.set_fact:
        cde_instance_type_try_list: "{{ ([instance_type] + cde_instance_type_fallbacks) | unique }}"
      when: not cde_service_present

    - name: Activate CDE service if it does not exist
      ansible.builtin.shell: |
        set -o pipefail
        last_err=""
        for t in {{ cde_instance_type_try_list | default([instance_type], true) | join(' ') }}; do
          err_file="$(mktemp)"
          if cdp de enable-service \
            --name "{{ workshop_name }}-cde" \
            --env "{{ cdp_env_name }}" \
            --instance-type "$t" \
            --minimum-instances "{{ minimum_instances | int }}" \
            --maximum-instances "{{ maximum_instances | int }}" \
            --initial-instances "{{ initial_instances | int }}" \
            --enable-public-endpoint \
            --azure-service-managed-identity "{{ cde_cluster_managed_identity_id }}" \
            --azure-virtual-cluster-managed-identities "{{ cde_vc_managed_identity_id }}" \
            2>"$err_file"; then
            echo "CDE enabled with instance type $t"
            rm -f "$err_file"
            exit 0
          fi
          last_err="$(cat "$err_file")"
          rm -f "$err_file"
          if grep -qi 'not able to find instance type' <<<"$last_err"; then
            echo "CDE instance type $t not available, trying next..." >&2
            continue
          fi
          if grep -qiE 'already exists|CONFLICT' <<<"$last_err"; then
            echo "CDE cluster already exists — continuing with status wait"
            rm -f "$err_file"
            exit 0
          fi
          echo "$last_err" >&2
          exit 1
        done
        echo "$last_err" >&2
        exit 1
      args:
        executable: /bin/bash
      when: not cde_service_present
      register: deservice

    - name: Check the CDE service status
      cloudera.cloud.de_info:
        name: "{{ workshop_name }}-cde"
      register: deservicestatus
      until: >
        (deservicestatus.services | default([], true) | length) > 0 and
        deservicestatus.services[0].status == "ClusterCreationCompleted"
      retries: 40
      delay: 120
      failed_when: false

    - name: Print the status
      debug:
        msg: "{{ deservicestatus }}"

    - name: List existing virtual clusters
      ansible.builtin.shell: >
        cdp de list-vcs --cluster-id "{{ deservicestatus.services[0].clusterId }}" | jq -r '.vcs[]?.vcName // empty'
      register: existing_vcs
      failed_when: false

    - name: Debug existing virtual clusters
      debug:
        msg: "Existing virtual clusters: {{ existing_vcs.stdout_lines }}"

    - name: Build missing virtual cluster deployment plan
      ansible.builtin.set_fact:
        vc_deploy_plan_missing: >-
          {%- set missing = [] -%}
          {%- for i in range(1, (number_vc_to_create | default(1) | int) + 1) -%}
          {%- set suffix = '%02d' | format(i) -%}
          {%- set name = workshop_name ~ '-cde-vc-' ~ suffix -%}
          {%- if name not in existing_vcs.stdout_lines -%}
          {%- set _ = missing.append({'name': name, 'suffix': suffix}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ missing }}

    - name: Debug virtual clusters to create
      ansible.builtin.debug:
        msg: "Virtual clusters to create: {{ vc_deploy_plan_missing | map(attribute='name') | list }}"

    - name: Start virtual cluster deployments async
      ansible.builtin.command: >
        cdp de create-vc
        --name "{{ item.name }}"
        --cluster-id "{{ deservicestatus.services[0].clusterId }}"
        --spark-version "{{ cde_spark_version_cli | default(spark_version) }}"
        --cpu-requests "20"
        --memory-requests "80Gi"
        --vc-tier "{{ vc_tier }}"
      loop: "{{ vc_deploy_plan_missing }}"
      async: "{{ cde_async_timeout }}"
      poll: 0
      register: vc_async_jobs
      when: vc_deploy_plan_missing | length > 0
      ignore_errors: true

    - name: Wait for virtual cluster async provisioning jobs
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: vc_async_results
      until: vc_async_results.finished
      retries: "{{ cde_async_retries }}"
      delay: "{{ cde_async_delay }}"
      loop: "{{ vc_async_jobs.results | default([]) | selectattr('ansible_job_id', 'defined') | list }}"
      when: vc_deploy_plan_missing | length > 0
      ignore_errors: true

    - name: Fail on unexpected virtual cluster deployment errors
      ansible.builtin.fail:
        msg: "Failed to create {{ item.item.item.name | default('virtual cluster') }}: {{ item.stderr | default(item.msg) }}"
      loop: "{{ vc_async_results.results | default([]) }}"
      when:
        - item.finished | default(false)
        - item.rc | default(0) != 0
        - "'already exists' not in (item.stderr | default('') | lower)"
        - "'ALREADY_EXISTS' not in (item.stderr | default(''))"