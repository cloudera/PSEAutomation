---
- name: Disable CDE Data Service
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    cde_async_timeout: 3600
    cde_async_retries: 60
    cde_async_delay: 30
  tasks:
    - name: Check if CDE service exists
      cloudera.cloud.de_info:
        name: "{{ workshop_name }}-cde"
      register: cde_service_info
      failed_when: false

    - name: Skip CDE teardown when service does not exist
      ansible.builtin.debug:
        msg: "CDE service not found for {{ workshop_name }}-cde — nothing to disable."
      when: (cde_service_info.services | default([], true) | length) == 0

    - name: End play when CDE service does not exist
      ansible.builtin.meta: end_play
      when: (cde_service_info.services | default([], true) | length) == 0

    - name: Mark CDE teardown as started
      ansible.builtin.set_fact:
        cde_teardown_started: true

    - name: List CDE virtual clusters
      cloudera.cloud.de_virtual_cluster_info:
        cluster_name: "{{ workshop_name }}-cde"
        environment: "{{ workshop_name }}-cdp-env"
      register: virtualclusters
      failed_when: false

    - name: Extract the virtual clusters id
      ansible.builtin.set_fact:
        vc_ids: "{{ virtualclusters['vcs'] | community.general.json_query(query_string) | default([]) }}"
      vars:
        query_string: "[].{vcId:vcId,clusterId:clusterId}"

    - name: No CDE virtual clusters to delete
      ansible.builtin.debug:
        msg: "No CDE virtual clusters found for {{ workshop_name }}-cde."
      when: (vc_ids | default([], true) | length) == 0

    - name: Start virtual cluster deletions async
      ansible.builtin.command: >
        cdp de delete-vc
        --cluster-id "{{ item.clusterId }}"
        --vc-id "{{ item.vcId }}"
      loop: "{{ vc_ids }}"
      async: "{{ cde_async_timeout }}"
      poll: 0
      register: vc_delete_async
      failed_when: false
      when: (vc_ids | default([], true) | length) > 0

    - name: Wait for virtual cluster delete async jobs
      ansible.builtin.async_status:
        jid: "{{ item.ansible_job_id }}"
      register: vc_delete_async_results
      until: vc_delete_async_results.finished
      retries: "{{ cde_async_retries }}"
      delay: "{{ cde_async_delay }}"
      loop: "{{ vc_delete_async.results | default([]) | selectattr('ansible_job_id', 'defined') | list }}"
      failed_when: false
      when: (vc_ids | default([], true) | length) > 0

    - name: Deactivate CDE service
      cloudera.cloud.de:
        name: "{{ workshop_name }}-cde"
        env: "{{ workshop_name }}-cdp-env"
        state: absent
        wait: False
      register: deactivation
      failed_when: false

    - name: Check status of CDE service until completely deleted
      cloudera.cloud.de_info:
        name: "{{ workshop_name }}-cde"
      register: serstatus
      until: >
        (serstatus.services | default([], true) | length) == 0
        or (
          (serstatus.services | default([], true) | length) > 0
          and serstatus.services[0].status in ["Deleting", "Error", "Failed"]
        )
      retries: 60
      delay: 30
      failed_when: false

    - name: Confirm CDE service deleted successfully
      ansible.builtin.debug:
        msg: "CDE service {{ workshop_name }}-cde deleted successfully."
      when:
        - cde_teardown_started | default(false)
        - (serstatus.services | default([], true) | length) == 0

    - name: End play after successful CDE deletion
      ansible.builtin.meta: end_play
      when:
        - cde_teardown_started | default(false)
        - (serstatus.services | default([], true) | length) == 0

    - name: Fail task if CDE service deletion failed
      ansible.builtin.fail:
        msg: "CDE service deletion failed with status {{ serstatus.services[0].status }}."
      when:
        - (serstatus.services | default([], true) | length) > 0
        - serstatus.services[0].status in ["Error", "Failed"]
